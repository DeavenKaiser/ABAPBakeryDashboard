<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ABAP Bakery — Sign In</title>
  <link rel="stylesheet" href="style.css?v=1784932750">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6B4F3A">
</head>
<body>
  <div class="wrap">
    <div class="card login-box">
      <h1>ABAP Bakery</h1>
      <p class="muted center">Team Operations</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="error" id="err"></div>
      <button id="loginBtn" type="button" style="width:100%">Sign In</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1784932750"></script>
  <script>
    // If already signed in, skip straight to the app.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();

    const err = document.getElementById("err");
    // Friendly note if we arrived here from an inactivity timeout
    if (new URLSearchParams(location.search).get("timeout") === "1") {
      err.textContent = "You were signed out after 30 minutes of inactivity. Please sign in again.";
      err.style.color = "#6B4F3A";
    }
    // Guard: if the Supabase library didn't load (flaky connection), say so
    // instead of leaving a dead button.
    if (typeof sb === "undefined") {
      err.textContent = "Couldn't reach the server. Check your connection and reload.";
      err.style.color = "var(--red)";
    }

    document.getElementById("loginBtn").addEventListener("click", doLogin);
    document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

    async function doLogin() {
      try {
        err.style.color = "var(--red)";
        err.textContent = "";
        if (typeof sb === "undefined") { err.textContent = "Couldn't reach the server. Reload and try again."; return; }
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        if (!email || !password) { err.textContent = "Enter your email and password."; return; }
        const btn = document.getElementById("loginBtn");
        btn.disabled = true; btn.textContent = "Signing in…";
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { err.textContent = error.message; btn.disabled = false; btn.textContent = "Sign In"; return; }
        const prof = await getMyProfile();
        if (prof && prof.must_change_password) { window.location.href = "change-password.html"; return; }
        window.location.href = "dashboard.html";
      } catch (e) {
        err.textContent = "Something went wrong signing in: " + (e.message || e);
        const btn = document.getElementById("loginBtn");
        if (btn) { btn.disabled = false; btn.textContent = "Sign In"; }
      }
    }
  </script>
</body>
</html>
