<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Units</title>
  <link rel="stylesheet" href="style.css?v=1786657839">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6B4F3A">
</head>
<body class="dash">
  <div class="wrap" id="app"><div class="empty">Loading…</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1786657839"></script>
  <script src="nav.js?v=1786657839"></script>
  <script>
    let IS_ADMIN=false, ITEMS=[], UNITS=[], TAB="fix";

    (async () => {
      if (!(await requireLogin())) return;
      const prof = await getMyProfile();
      IS_ADMIN = prof && prof.role==="admin";
      await renderTopbar("Units", prof);
      renderNav("units", IS_ADMIN);
      if(!IS_ADMIN){ document.getElementById("app").innerHTML=`<div class="card"><div class="empty">Admins only.</div></div>`; return; }
      await load();
    })();

    async function load(){
      const [{data:items},{data:units}] = await Promise.all([
        sb.from("inventory_items").select("id,name,owner,category,unit,pack_unit,pack_size,base_unit,units_need_review,unit_cost").order("name"),
        sb.from("units").select("*").eq("active",true).order("sort_order"),
      ]);
      ITEMS = items||[]; UNITS = units||[];
      render();
    }
    const baseUnits = () => UNITS.filter(u=>!u.is_pack);
    const packUnits = () => UNITS.filter(u=>u.is_pack);
    const unitByCode = c => UNITS.find(u=>u.code===c);

    function render(){
      const needs = ITEMS.filter(i=>i.units_need_review);
      let html=`<div class="hero" style="padding:18px 22px"><div>
        <h1 style="font-size:22px">Units</h1>
        <div class="sub">Standard bakery measures — no more "a bag of flour"</div></div>
        <button class="mini" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4)" onclick="location.href='inventory.html'">← Inventory</button>
      </div>`;

      html+=`<div class="card" style="margin-bottom:12px"><div class="fs-bar">
        <button class="${TAB==="fix"?"":"secondary"}" onclick="TAB='fix';render()">Needs attention${needs.length?" ("+needs.length+")":""}</button>
        <button class="${TAB==="all"?"":"secondary"}" onclick="TAB='all';render()">All items</button>
        <button class="${TAB==="list"?"":"secondary"}" onclick="TAB='list';render()">Unit list</button>
      </div></div>`;

      if(TAB==="fix") html+=fixView(needs);
      else if(TAB==="all") html+=allView();
      else html+=unitListView();
      document.getElementById("app").innerHTML=html;
    }

    // ---- items needing a real unit ----
    function fixView(needs){
      if(!needs.length) return `<div class="card"><div class="empty">Every item has a proper unit. 🎉</div></div>`;
      let html=`<div class="card"><div class="stat-label">
        These items have a vague or missing unit. Say how much is in one — e.g. a bag of flour is
        <strong>50 lb</strong>, a syrup bottle is <strong>32 fl oz</strong>.</div></div>`;
      needs.forEach(i=>{ html+=itemRow(i,true); });
      return html;
    }
    function allView(){
      let html=`<div class="card"><div class="stat-label">Every item's unit setup. Change any of them here.</div></div>`;
      const byOwner={};
      ITEMS.forEach(i=>{ (byOwner[i.owner||"shared"]||=[]).push(i); });
      Object.keys(byOwner).sort().forEach(o=>{
        html+=`<h2 class="section">${esc(roleLabel(o))}</h2>`;
        byOwner[o].forEach(i=>{ html+=itemRow(i,false); });
      });
      return html;
    }

    function itemRow(i, highlight){
      const pu=i.pack_unit||"", ps=i.pack_size??"", bu=i.base_unit||"";
      const isPack = pu ? (unitByCode(pu)||{}).is_pack : false;
      // NOTE: the fallback branch is intentional HTML, so `summary` is inserted
      // raw below. Everything interpolated into the other branch must therefore
      // be escaped HERE — unit codes come from the admin-editable units table.
      const summary = (!i.units_need_review && i.base_unit)
        ? (isPack ? `1 ${esc(pu)} = ${Number(i.pack_size)} ${esc(i.base_unit)}` : `measured in ${esc(i.base_unit)}`)
        : `<span style="color:var(--berry);font-weight:700">needs a real unit</span>`;
      return `<div class="card" style="margin-bottom:8px;${highlight?'border-left:3px solid var(--berry)':''}">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:baseline">
          <strong>${esc(i.name)}</strong><span class="stat-label">${summary}</span>
        </div>
        <div class="fs-bar" style="margin-top:8px">
          <label class="stat-label">Bought as
            <select id="pu_${i.id}" onchange="onPackChange(${i.id})">
              <option value="">—</option>
              <optgroup label="Containers (need a size)">
                ${packUnits().map(u=>`<option value="${attr(u.code)}" ${pu===u.code?"selected":""}>${esc(u.label)}</option>`).join("")}
              </optgroup>
              <optgroup label="Measured directly">
                ${baseUnits().map(u=>`<option value="${attr(u.code)}" ${pu===u.code?"selected":""}>${esc(u.label)} (${esc(u.code)})</option>`).join("")}
              </optgroup>
            </select></label>
          <span id="packbits_${i.id}" style="display:${isPack?"inline-flex":"none"};gap:6px;align-items:center">
            <label class="stat-label">holding
              <input type="number" step="0.01" id="ps_${i.id}" value="${ps}" class="in-money" placeholder="qty"></label>
            <select id="bu_${i.id}">
              <option value="">—</option>
              ${baseUnits().map(u=>`<option value="${attr(u.code)}" ${bu===u.code?"selected":""}>${esc(u.code)}</option>`).join("")}
            </select>
          </span>
          <button class="mini" onclick="saveUnits(${i.id})">Save</button>
        </div>
        <div class="stat-label" id="err_${i.id}" style="color:var(--berry)"></div>
      </div>`;
    }
    function onPackChange(id){
      const code=document.getElementById("pu_"+id).value;
      const u=unitByCode(code);
      document.getElementById("packbits_"+id).style.display = (u&&u.is_pack)?"inline-flex":"none";
    }
    async function saveUnits(id){
      const err=document.getElementById("err_"+id); err.textContent="";
      const pack_unit=document.getElementById("pu_"+id).value||null;
      const u=unitByCode(pack_unit);
      let pack_size=null, base_unit=null;
      if(u && u.is_pack){
        pack_size=Number(document.getElementById("ps_"+id).value);
        base_unit=document.getElementById("bu_"+id).value||null;
        if(!pack_size||pack_size<=0){ err.textContent="Enter how much is in one "+u.label.toLowerCase()+"."; return; }
        if(!base_unit){ err.textContent="Pick the measure (lb, fl oz, each…)."; return; }
      } else if(u){
        pack_size=1; base_unit=u.code;
      } else {
        err.textContent="Pick how it's bought."; return;
      }
      const { error } = await sb.from("inventory_items")
        .update({pack_unit,pack_size,base_unit}).eq("id",id);
      if(error){ err.textContent=error.message; return; }
      const it=ITEMS.find(x=>x.id===id);
      it.pack_unit=pack_unit; it.pack_size=pack_size; it.base_unit=base_unit; it.units_need_review=false;
      render();
    }

    // ---- unit reference list ----
    function unitListView(){
      let html=`<div class="card"><div class="stat-label">
        Standard measures the app accepts. Containers (bag, bottle, case…) always require a size,
        which is what stops vague units getting in.</div></div>`;
      ["weight","volume","count","pack"].forEach(kind=>{
        const list=UNITS.filter(u=>u.kind===kind);
        if(!list.length) return;
        const title={weight:"Weight",volume:"Volume",count:"Count",pack:"Containers"}[kind];
        html+=`<h2 class="section">${title}</h2><div class="card"><div style="overflow-x:auto"><table class="rpt">
          <tr><th>Unit</th><th>Code</th><th class="num">${kind==="pack"?"":"= base"}</th><th></th></tr>`;
        list.forEach(u=>{
          const base = kind==="weight"?"g":kind==="volume"?"ml":kind==="count"?"each":"";
          html+=`<tr><td>${esc(u.label)}</td><td><code>${esc(u.code)}</code></td>
            <td class="num">${u.is_pack?'<span class="stat-label">needs a size</span>':(u.to_base+" "+base)}</td>
            <td><button class="mini secondary" style="padding:3px 8px" onclick="delUnit(${jsArg(u.code)})">✕</button></td></tr>`;
        });
        html+=`</table></div></div>`;
      });
      html+=`<div class="card"><h3 style="font-family:'Fraunces',serif;margin:0 0 8px">Add a unit</h3>
        <div class="fs-bar">
          <input type="text" id="nuCode" placeholder="code (e.g. pallet)" class="in-label">
          <input type="text" id="nuLabel" placeholder="label" class="in-label">
          <select id="nuKind">
            <option value="pack">Container (needs a size)</option>
            <option value="weight">Weight</option>
            <option value="volume">Volume</option>
            <option value="count">Count</option>
          </select>
          <input type="number" step="0.0001" id="nuBase" placeholder="= base" class="in-money">
          <button class="mini" onclick="addUnit()">Add</button>
        </div>
        <div class="stat-label" style="margin-top:6px">For weight enter grams, for volume millilitres. Containers leave blank.</div>
      </div>`;
      return html;
    }
    async function addUnit(){
      const code=(document.getElementById("nuCode").value||"").trim().toLowerCase();
      const label=(document.getElementById("nuLabel").value||"").trim();
      const kind=document.getElementById("nuKind").value;
      const tb=document.getElementById("nuBase").value;
      if(!code||!label){ alert("Enter a code and label."); return; }
      const is_pack = kind==="pack";
      if(!is_pack && !tb){ alert("Enter what it equals in the base measure."); return; }
      const { error } = await sb.from("units").insert({
        code,label,kind,is_pack, to_base: is_pack?null:Number(tb), sort_order:99
      });
      if(error){ alert(error.message); return; }
      await load();
    }
    async function delUnit(code){
      if(!confirm("Remove the unit \""+code+"\"? Items using it will need a new unit.")) return;
      const { error } = await sb.from("units").update({active:false}).eq("code",code);
      if(error){ alert(error.message); return; }
      await load();
    }
  </script>
</body>
</html>
