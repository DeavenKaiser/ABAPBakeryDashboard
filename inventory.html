<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css?v=1784932750">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6B4F3A">
</head>
<body>
  <div class="wrap" id="app"><div class="empty">Loading…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1784932750"></script>
  <script src="nav.js?v=1784932750"></script>
  <script>
    let ITEMS = [], STATUSSET = new Set(), TYPESET = new Set(), SORTBY = "category", IS_ADMIN = false, MY_ROLE = null, SCOPE = "mine";

    (async () => {
      if (!(await requireLogin())) return;
      const prof = await getMyProfile();
      IS_ADMIN = prof && prof.role === "admin";
      MY_ROLE = profileJobRole(prof);   // baker / barista / cleaning (or null)
      // Admins default to All; staff default to My Items (if they have a role)
      SCOPE = IS_ADMIN ? "all" : (MY_ROLE ? "mine" : "all");
      // Deep-link from dashboard pie: ?filter=below / ?filter=extra
      const urlFilter = new URLSearchParams(location.search).get("filter");
      if (urlFilter === "below" || urlFilter === "extra") {
        STATUSSET.add(urlFilter);
        SCOPE = "all";   // show across all items when arriving from a dashboard jump
      }
      await renderTopbar("Inventory", prof);
      renderNav("inventory", IS_ADMIN);
      await load();
      subscribeToChanges(["inventory_items","order_log"], () => load());
    })();

    async function load() {
      // admins read the meta view (includes updated_by_name); staff read the plain table
      const source = IS_ADMIN ? "v_inventory_meta" : "inventory_items";
      const { data } = await sb.from(source)
        .select("*").order("owner").order("category").order("name");
      ITEMS = data || [];
      render();
    }
function canEditCount(it) {
      // Admins can do anything staff can — including update any item's count, anytime.
      if (IS_ADMIN) return true;
      // 'shared' items: anyone. Otherwise only the person whose job matches the owner.
      if (it.owner === "shared") return true;
      return MY_ROLE && it.owner === MY_ROLE;
    }

    function render() {
      const app = document.getElementById("app");
      let list = ITEMS.slice();

      // Scope: My Items vs All Inventory
      if (SCOPE === "mine" && MY_ROLE) {
        list = list.filter(i => i.owner === MY_ROLE);
      }

      // Counts for the dropdown labels (based on current scope, before status/type filters)
      const belowN = list.filter(isBelow).length;
      const extraN = list.filter(i => i.order_extra).length;
      const toCount = ITEMS.filter(i => !i.counted_this_week).length;

      // Status filter (multi-select, OR within the group)
      if (STATUSSET.size) {
        list = list.filter(i =>
          (STATUSSET.has("below") && isBelow(i)) ||
          (STATUSSET.has("extra") && i.order_extra) ||
          (STATUSSET.has("tocount") && !i.counted_this_week)
        );
      }
      // Type filter (multi-select)
      if (TYPESET.size) {
        list = list.filter(i => TYPESET.has(i.category||"Other"));
      }
      // Sort
      if (SORTBY === "name") list.sort((a,b)=>a.name.localeCompare(b.name));
      else if (SORTBY === "category") list.sort((a,b)=>(a.category||"Other").localeCompare(b.category||"Other")||a.name.localeCompare(b.name));
      else if (SORTBY === "count") list.sort((a,b)=>(a.current_on_hand??1e9)-(b.current_on_hand??1e9));
      else if (SORTBY === "counthi") list.sort((a,b)=>(b.current_on_hand??-1)-(a.current_on_hand??-1));

      let html = "";
      // Scope tabs (only meaningful if the person has a role)
      if (MY_ROLE || IS_ADMIN) {
        const mineLabel = MY_ROLE ? `My Items (${roleLabel(MY_ROLE)})` : "My Items";
        html += `<div class="card"><div style="display:flex;gap:8px">
          <button class="${SCOPE==='mine'?'':'secondary'}" onclick="SCOPE='mine';render()" ${!MY_ROLE?'disabled style=\"opacity:.5\"':''}>${mineLabel}</button>
          <button class="${SCOPE==='all'?'':'secondary'}" onclick="SCOPE='all';render()">All Inventory</button>
        </div></div>`;
      }

      // Build the set of categories present (for the type filter)
      const allCats = [...new Set(ITEMS.map(i=>i.category||"Other"))].sort();
      const sortLabels={name:"Name A–Z",category:"Type",count:"Count low→high",counthi:"Count high→low"};
      html += `<div class="card"><div class="fs-bar">
        <div class="fs-drop">
          <button class="fs-btn ${STATUSSET.size?"has-active":""}" onclick="fsToggle(this)">Status${STATUSSET.size?" ("+STATUSSET.size+")":""} <span class="chev">▼</span></button>
          <div class="fs-menu">
            <label class="fs-opt ${STATUSSET.has("below")?"selected":""}"><input type="checkbox" ${STATUSSET.has("below")?"checked":""} onchange="toggleStatus('below')"> Below (${belowN})</label>
            <label class="fs-opt ${STATUSSET.has("extra")?"selected":""}"><input type="checkbox" ${STATUSSET.has("extra")?"checked":""} onchange="toggleStatus('extra')"> Order Extra (${extraN})</label>
            <label class="fs-opt ${STATUSSET.has("tocount")?"selected":""}"><input type="checkbox" ${STATUSSET.has("tocount")?"checked":""} onchange="toggleStatus('tocount')"> To Count (${list.filter(i=>!i.counted_this_week).length})</label>
            <div class="fs-actions"><button onclick="clearStatus()">Clear</button></div>
          </div>
        </div>
        <div class="fs-drop">
          <button class="fs-btn ${TYPESET.size?"has-active":""}" onclick="fsToggle(this)">Type${TYPESET.size?" ("+TYPESET.size+")":""} <span class="chev">▼</span></button>
          <div class="fs-menu">
            ${allCats.map(c=>`<label class="fs-opt ${TYPESET.has(c)?"selected":""}"><input type="checkbox" ${TYPESET.has(c)?"checked":""} onchange="toggleType('${c.replace(/'/g,"\\'")}')"> ${c} (${ITEMS.filter(i=>(i.category||"Other")===c).length})</label>`).join("")}
            <div class="fs-actions"><button onclick="clearTypes()">Clear</button></div>
          </div>
        </div>
        <div class="fs-drop">
          <button class="fs-btn" onclick="fsToggle(this)">Sort: ${sortLabels[SORTBY]} <span class="chev">▼</span></button>
          <div class="fs-menu">
            <label class="fs-opt ${SORTBY==="name"?"selected":""}"><input type="radio" name="isort" ${SORTBY==="name"?"checked":""} onchange="setSort('name')"> Name A–Z</label>
            <label class="fs-opt ${SORTBY==="category"?"selected":""}"><input type="radio" name="isort" ${SORTBY==="category"?"checked":""} onchange="setSort('category')"> Type</label>
            <label class="fs-opt ${SORTBY==="count"?"selected":""}"><input type="radio" name="isort" ${SORTBY==="count"?"checked":""} onchange="setSort('count')"> Count low→high</label>
            <label class="fs-opt ${SORTBY==="counthi"?"selected":""}"><input type="radio" name="isort" ${SORTBY==="counthi"?"checked":""} onchange="setSort('counthi')"> Count high→low</label>
          </div>
        </div>
      </div></div>`;

      if (IS_ADMIN) {
        html += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
          <span class="muted">Admin</span>${editToggleHtml()}</div></div>`;
      }

      // Admin: add a new inventory item (only in edit mode)
      if (IS_ADMIN && editMode()) {
        html += `<div class="card">
          <div class="field" style="margin-bottom:8px"><label>Add inventory item</label>
            <input type="text" id="niName" placeholder="Item name"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select id="niOwner" style="font-size:15px;padding:9px;border-radius:8px;border:1px solid var(--line)">
              <option value="baker">Baker</option><option value="barista">Barista</option>
              <option value="cleaning">Cleaning</option><option value="shared">Shared</option>
            </select>
            <input type="text" id="niCat" placeholder="Category" style="width:120px">
            <input type="text" id="niUnit" placeholder="Unit" style="width:90px">
            <input type="number" id="niThresh" placeholder="Threshold" style="width:100px">
            <button class="mini" onclick="addItem()">Add item</button>
          </div>
          <div class="error" id="niErr" style="min-height:auto"></div>
        </div>`;
      }

      // Group by category headers only when sorting by Type; otherwise flat list.
      const grouped = (SORTBY === "category");
      let lastGroup = "", open = false;
      if (!grouped) { html += `<div class="card">`; open = true; }
      list.forEach(it => {
        if (grouped) {
          const g = it.category || "Other";
          if (g !== lastGroup) { if (open) html += `</div>`; html += `<h2 class="section">${g}</h2><div class="card">`; lastGroup=g; open=true; }
        }
        const below = isBelow(it);
        let fresh = "";
        if (IS_ADMIN && it.updated_at) {
          const who = it.updated_by_name ? "by "+it.updated_by_name : "";
          const when = new Date(it.updated_at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
          fresh = `<div class="freshness">Last counted ${who} · ${when}</div>`;
        }
        const editing = IS_ADMIN && editMode();
        html += `<div class="row ${below?"below-row":""}">
          <div class="txt">
            ${editing
              ? `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
                   <input type="text" value="${(it.name||"").replace(/"/g,"&quot;")}" onchange="setField(${it.id},'name',this.value)"
                     style="font-size:15px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:140px;flex:1">
                 </div>
                 <div class="sub" style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">
                   <label>threshold <input type="number" step="any" value="${it.threshold??""}" onchange="setField(${it.id},'threshold',this.value)" style="width:64px"></label>
                   <label>unit <input type="text" value="${(it.unit||"").replace(/"/g,"&quot;")}" onchange="setField(${it.id},'unit',this.value)" style="width:64px"></label>
                   <label>min <input type="text" value="${(it.min_on_hand||"").toString().replace(/"/g,"&quot;")}" onchange="setField(${it.id},'min_on_hand',this.value)" style="width:64px"></label>
                 </div>`
              : `<div style="font-size:15px">${it.name}
                   ${below?'<span class="pill below">BELOW</span>':''}
                   ${it.order_extra?'<span class="pill extra">EXTRA</span>':''}</div>
                 <div class="sub">min ${it.min_on_hand??"—"} · threshold ${it.threshold??"—"}${it.unit?" · "+it.unit:""}${IS_ADMIN&&it.unit_cost!=null?` · $${it.unit_cost}/unit`:""}</div>`}
            <div style="margin-top:4px">
              <button class="tbtn extra ${it.order_extra?"on":""}" onclick="setExtra(${it.id}, ${!it.order_extra})">
                <span class="dot">${it.order_extra?"●":"○"}</span> Order extra</button>
              ${canEditCount(it)
                ? `<button class="tbtn counted ${it.counted_this_week?"on":""}" onclick="setCounted(${it.id}, ${!it.counted_this_week})">
                     <span class="dot">${it.counted_this_week?"✓":"○"}</span> Counted</button>`
                : `<span class="tbtn ${it.counted_this_week?"on counted":""}" style="opacity:.6;cursor:not-allowed">
                     <span class="dot">${it.counted_this_week?"✓":"○"}</span> Counted</span>`}
              ${editing?`<span class="tbtn" style="cursor:default;background:#f2ede4">$ <input type="number" step="0.01" value="${it.unit_cost??""}" placeholder="cost"
                  style="width:64px;border:none;background:transparent;font-size:13px;font-weight:700;padding:0 2px" onchange="setCost(${it.id},this.value)"></span>`:""}
            </div>
            ${fresh}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            ${canEditCount(it)
              ? `<input type="number" class="count-num" value="${it.current_on_hand??""}" placeholder="qty" onchange="setCount(${it.id},this.value)">`
              : `<div class="count-num" style="text-align:center;color:#a99;border:1px solid var(--line);border-radius:8px;padding:8px 0" title="Only ${roleLabel(it.owner)} can update this count">${it.current_on_hand??"—"}</div>`}
            ${editing?`<button class="mini" style="background:var(--red);padding:4px 9px;font-size:12px" onclick="delItem(${it.id})">✕ remove</button>`:""}
          </div>
        </div>`;
      });
      if (open) html += `</div>`;
      if (!list.length) html += `<div class="empty">Nothing here.</div>`;
      app.innerHTML = html;
    }
    function toggleStatus(s){ if(STATUSSET.has(s)) STATUSSET.delete(s); else STATUSSET.add(s); render(); }
    function clearStatus(){ STATUSSET.clear(); render(); }
    function toggleType(t){ if(TYPESET.has(t)) TYPESET.delete(t); else TYPESET.add(t); render(); }
    function clearTypes(){ TYPESET.clear(); render(); }
    function setSort(s){ SORTBY=s; render(); }

    async function setCount(id,val){
      const it=ITEMS.find(i=>i.id===id);
      if(!canEditCount(it)) return;   // guard
      const num = val===""?null:Number(val); it.current_on_hand=num;
      const { data:{user} } = await sb.auth.getUser();
      it.updated_at=new Date().toISOString();
      await sb.from("inventory_items").update({current_on_hand:num,updated_at:it.updated_at,updated_by:user.id}).eq("id",id);
      await load();
    }
    async function setExtra(id,on){ const it=ITEMS.find(i=>i.id===id); it.order_extra=on; await sb.from("inventory_items").update({order_extra:on}).eq("id",id); render(); }
    async function setCounted(id,on){ const it=ITEMS.find(i=>i.id===id); if(!canEditCount(it)) return; it.counted_this_week=on; await sb.from("inventory_items").update({counted_this_week:on}).eq("id",id); render(); }
    async function setCost(id,val){ const n=val===""?null:Number(val); ITEMS.find(i=>i.id===id).unit_cost=n; await sb.from("inventory_items").update({unit_cost:n}).eq("id",id); }
    async function setField(id, field, val){
      let v = val;
      if (field==="threshold") v = (val===""?null:Number(val));
      if (field==="name" && !val.trim()) { alert("Name can't be empty."); render(); return; }
      const item = ITEMS.find(i=>i.id===id);
      item[field] = v;
      const { error } = await sb.from("inventory_items").update({ [field]: v, updated_at:new Date().toISOString() }).eq("id",id);
      if (error) { alert("Couldn't save: "+error.message); return; }
      render();
    }

    async function addItem(){
      const err=document.getElementById("niErr"); err.textContent="";
      const name=document.getElementById("niName").value.trim();
      const owner=document.getElementById("niOwner").value;
      const category=document.getElementById("niCat").value.trim()||null;
      const unit=document.getElementById("niUnit").value.trim()||null;
      const tv=document.getElementById("niThresh").value;
      const threshold=tv===""?null:Number(tv);
      if(!name){ err.textContent="Enter an item name."; return; }
      const { error }=await sb.from("inventory_items").insert({name,owner,category,unit,threshold,order_extra:false,counted_this_week:false});
      if(error){ err.textContent=error.message; return; }
      await load();
    }
    async function delItem(id){
      const it=ITEMS.find(i=>i.id===id);
      if(!confirm(`Remove "${it?.name||"this item"}" from inventory?`)) return;
      await sb.from("inventory_items").delete().eq("id",id);
      await load();
    }
  </script>
</body>
</html>
