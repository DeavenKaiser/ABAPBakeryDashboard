<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Book</title>
  <link rel="stylesheet" href="style.css?v=1786725004">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6B4F3A">
</head>
<body class="dash">
  <div class="wrap" id="app"><div class="empty">Loading recipes…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1786725004"></script>
  <script src="nav.js?v=1786725004"></script>
  <script>
    let IS_ADMIN=false, CAN_EDIT=false, SEE_MONEY=false, RECIPES=[], INGREDIENTS=[], INV={}, OPTS={};
    let CATSET=new Set(), SORTBY="name", SEARCH="";

    (async () => {
      if (!(await requireLogin())) return;
      const prof = await getMyProfile();
      IS_ADMIN = prof && prof.role==="admin";
      const jobRole = profileJobRole(prof);
      // Mirrors is_admin_or_baker() in the database, which since migration 002
      // reads job_roles.can_edit_recipes rather than testing for "baker".
      // This is only a UI hint — RLS is what actually enforces it.
      CAN_EDIT = IS_ADMIN || !!(roleRow(jobRole) && roleRow(jobRole).can_edit_recipes);
      SEE_MONEY = IS_ADMIN;                         // money stays admin-only
      await renderTopbar("Recipe Book", prof);
      renderNav("recipes", IS_ADMIN);
      await load();
    })();

    async function load() {
      const [{data:recs},{data:ings},{data:inv},{data:opts}] = await Promise.all([
        sb.from("recipes").select("*").eq("active",true),
        sb.from("recipe_ingredients").select("*").order("sort_order"),
        sb.from("inventory_items").select("name,current_on_hand,threshold,owner,unit"),
        sb.from("recipe_options").select("*").order("sort_order"),
        // Feeds unitKind() so amounts format by measurement type.
        loadUnits(),
      ]);
      RECIPES = recs||[]; INGREDIENTS = ings||[];
      OPTS = {};
      (opts||[]).forEach(o => { (OPTS[o.recipe_id] ||= []).push(o); });
      INV = {};
      (inv||[]).forEach(i => { INV[(i.name||"").toLowerCase().trim()] = i; });
      render();
    }

    function stockStatus(ingName) {
      const key=(ingName||"").toLowerCase().trim();
      let it = INV[key];
      if (!it) { const f=Object.keys(INV).find(k=>k.includes(key)||key.includes(k)); if(f) it=INV[f]; }
      if (!it) return { label:"not tracked", color:"#b0a48f", have:null, unit:null };
      const have = it.current_on_hand;
      const unit = it.unit||"";
      const below = it.current_on_hand!=null && it.threshold!=null && Number(it.current_on_hand)<Number(it.threshold);
      if (it.current_on_hand==null) return { label:"in inventory", color:"var(--sage)", have:null, unit };
      if (below) return { label:"low", color:"var(--berry)", have, unit };
      return { label:"in stock", color:"var(--sage)", have, unit };
    }

    function categories(){
      const set=[...new Set(RECIPES.map(r=>r.category||"Other"))].sort();
      // put Drinks near the end so bakery items lead
      return set;
    }
    function ingCount(r){ return INGREDIENTS.filter(i=>i.recipe_id===r.id).length; }
    function recipeCost(r){ return INGREDIENTS.filter(i=>i.recipe_id===r.id).reduce((s,i)=>s+(i.est_cost!=null?Number(i.est_cost):0),0); }

    function render() {
      const app=document.getElementById("app");

      let html = `<div class="hero" style="padding:18px 22px">
        <div><h1 style="font-size:22px">Recipe Book</h1>
        <div class="sub">${RECIPES.length} recipes${SEE_MONEY?" · you can see costs":""}${CAN_EDIT?" · you can edit":""}</div></div>
      </div>`;

      // Admin: add recipe button
      if (CAN_EDIT) {
        html += `<div style="margin-bottom:12px"><button class="mini" onclick="openEditor()">+ Add recipe</button></div>`;
      }

      // Search + filter + sort bar
      const cats=categories();
      const sortLabels={name:"Name A–Z",ingredients:"# Ingredients",cost:"Cost"};
      html += `<div class="card" style="margin-bottom:12px">
        <input type="text" id="search" placeholder="Search recipes…" value="${SEARCH}" oninput="SEARCH=this.value;renderList()" style="margin-bottom:10px">
        <div class="fs-bar">
          <div class="fs-drop">
            <button class="fs-btn ${CATSET.size?"has-active":""}" onclick="fsToggle(this)">
              Filter${CATSET.size?" ("+CATSET.size+")":""} <span class="chev">▼</span></button>
            <div class="fs-menu">
              ${cats.map(c=>`<label class="fs-opt ${CATSET.has(c)?"selected":""}">
                <input type="checkbox" ${CATSET.has(c)?"checked":""} onchange="toggleCat(${jsArg(c)})">
                ${esc(c)} (${RECIPES.filter(r=>(r.category||"Other")===c).length})</label>`).join("")}
              <div class="fs-actions"><button onclick="clearCats()">Clear</button></div>
            </div>
          </div>
          <div class="fs-drop">
            <button class="fs-btn" onclick="fsToggle(this)">Sort: ${sortLabels[SORTBY]} <span class="chev">▼</span></button>
            <div class="fs-menu">
              <label class="fs-opt ${SORTBY==="name"?"selected":""}"><input type="radio" name="rsort" ${SORTBY==="name"?"checked":""} onchange="setSort('name')"> Name A–Z</label>
              <label class="fs-opt ${SORTBY==="ingredients"?"selected":""}"><input type="radio" name="rsort" ${SORTBY==="ingredients"?"checked":""} onchange="setSort('ingredients')"> # Ingredients</label>
              ${SEE_MONEY?`<label class="fs-opt ${SORTBY==="cost"?"selected":""}"><input type="radio" name="rsort" ${SORTBY==="cost"?"checked":""} onchange="setSort('cost')"> Cost</label>`:""}
            </div>
          </div>
        </div>
      </div>`;

      html += `<div id="recipeList"></div>`;
      app.innerHTML = html;
      renderList();
    }
    function toggleCat(c){ if(CATSET.has(c)) CATSET.delete(c); else CATSET.add(c); render(); }
    function clearCats(){ CATSET.clear(); render(); }
    function setSort(s){ SORTBY=s; render(); }


    function renderList(){
      let list = RECIPES.slice();
      if (CATSET.size) list=list.filter(r=>CATSET.has(r.category||"Other"));
      if (SEARCH.trim()){ const q=SEARCH.toLowerCase(); list=list.filter(r=>r.name.toLowerCase().includes(q)); }
      if (SORTBY==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
      else if (SORTBY==="ingredients") list.sort((a,b)=>ingCount(b)-ingCount(a));
      else if (SORTBY==="cost") list.sort((a,b)=>recipeCost(b)-recipeCost(a));

      const el=document.getElementById("recipeList");
      if(!list.length){ el.innerHTML=`<div class="empty">No recipes match.</div>`; return; }
      el.innerHTML = list.map(recipeCard).join("");
    }

    // ---------- scaling ----------
    // SCALE holds the yield the user has dialled in, per recipe. View-only and
    // never saved — it's a bench tool, not an edit to the recipe.
    const SCALE = {};

    function baseYield(r)   { return r.yield_qty != null ? Number(r.yield_qty) : null; }
    function wantYield(r)   { return SCALE[r.id] != null ? SCALE[r.id] : baseYield(r); }
    function scaleFactor(r) {
      const base = baseYield(r), want = wantYield(r);
      if (!base || base <= 0 || !want || want <= 0) return 1;
      return want / base;
    }
    // Trim float noise so 24.000 reads as 24 in an input.
    function formatNum(n){ return n == null ? "" : String(Math.round(Number(n)*1000)/1000); }

    function ingredientRows(r, ings) {
      const f = scaleFactor(r);
      return ings.map(ing => {
        const st = stockStatus(ing.ingredient);
        const amt = ing.amount != null ? Number(ing.amount) * f : null;
        // Formatted by what the unit IS: decimals for weight, fractions for
        // volume, a whole-number suggestion for things you can't halve.
        const q = amt != null ? formatQty(amt, ing.unit) : { text: "", note: "" };
        const need = amt != null
          ? `${esc(q.text)} ${esc(ing.unit||"")}${q.note
              ? `<div class="stat-label" style="color:var(--honey);font-weight:700">${esc(q.note)}</div>` : ""}`
          : esc(ing.unit||"—");
        const have = st.have != null
          ? `${esc(formatQty(st.have, st.unit).text)} ${esc(st.unit||"")}` : "—";
        // Only compare when the units actually match — "2 cups" vs "5 lb" is
        // not a shortage, it's a unit mismatch, and claiming otherwise is worse
        // than staying quiet.
        const short = amt != null && st.have != null && st.unit === ing.unit && st.have < amt - 1e-9;
        const cost = ing.est_cost != null ? Number(ing.est_cost) * f : null;
        return `<tr>
          <td><span class="dot-tag" style="background:${short?'var(--berry)':st.color};display:inline-block;margin-right:6px"></span>${esc(ing.ingredient)}</td>
          <td class="num"${short?' style="color:var(--berry);font-weight:700"':''}>${need}</td>
          <td class="num" style="color:${short||st.color==='var(--berry)'?'var(--berry)':'inherit'}">${have}</td>
          ${SEE_MONEY ? `<td class="num" style="color:var(--crust)">${cost!=null?"$"+cost.toFixed(2):""}</td>`:""}
        </tr>`;
      }).join("");
    }

    function scaleBar(r) {
      const base = baseYield(r);
      if (!base) {
        return CAN_EDIT
          ? `<div class="stat-label" style="margin-bottom:8px">No yield set, so this can't be scaled —
               <button class="mini secondary" style="padding:2px 8px" data-action="edit-recipe"
               data-id="${attr(r.id)}">add one</button></div>`
          : `<div class="stat-label" style="margin-bottom:8px">No yield set yet, so this can't be scaled.</div>`;
      }
      const want = wantYield(r), f = scaleFactor(r), unit = r.yield_unit || "";
      const scaled = Math.abs(f - 1) > 1e-9;
      return `<div class="card" style="margin-bottom:10px;padding:10px 12px;background:#fbf7f0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="stat-label" style="font-weight:700">Makes</span>
          <button class="mini secondary" style="padding:4px 12px;font-size:18px;line-height:1"
            data-action="scale-step" data-id="${attr(r.id)}" data-delta="-1" title="Less">−</button>
          <input type="number" min="0" step="any" value="${attr(formatNum(want))}" data-input="scale-set"
            data-id="${attr(r.id)}" style="width:76px;text-align:center;font-weight:700">
          <button class="mini secondary" style="padding:4px 12px;font-size:18px;line-height:1"
            data-action="scale-step" data-id="${attr(r.id)}" data-delta="1" title="More">+</button>
          <span class="stat-label">${esc(unit)}</span>
          <span style="flex:1"></span>
          ${[["0.5","½×"],["2","2×"],["3","3×"]].map(([m,lab])=>
            `<button class="mini secondary" style="padding:4px 10px" data-action="scale-mult"
               data-id="${attr(r.id)}" data-mult="${m}">${lab}</button>`).join("")}
          ${scaled?`<button class="mini" style="padding:4px 10px" data-action="scale-reset"
               data-id="${attr(r.id)}">Reset</button>`:""}
        </div>
        ${scaled?`<div class="stat-label" style="margin-top:6px;color:var(--crust);font-weight:700">
          Scaled ${esc(formatAmount(f))}× from ${esc(formatNum(base))} ${esc(unit)}.</div>`:""}
      </div>`;
    }

    // Repaint one card in place. A full renderList() would collapse every open
    // <details> — intolerable when you're mid-bake with one expanded.
    function repaintScale(id, skipBar) {
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      const ings = INGREDIENTS.filter(i => i.recipe_id === r.id);
      if (!skipBar) {
        const bar = document.getElementById("scalebar-" + id);
        if (bar) bar.innerHTML = scaleBar(r);
      }
      const body = document.getElementById("ingrows-" + id);
      if (body) body.innerHTML = ingredientRows(r, ings);
    }

    function setScale(id, value, skipBar) {
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      const v = Number(value);
      SCALE[id] = (!isFinite(v) || v <= 0) ? baseYield(r) : v;
      repaintScale(id, skipBar);
    }

    onAction("scale-step", el => {
      const id = Number(el.dataset.id);
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      // Always ±1. If you want 25 scones you should be able to ask for 25 —
      // the yield is the thing you're choosing, so it shouldn't be the thing
      // that's constrained. Whole-number handling belongs on the ingredients
      // that genuinely can't be halved, and that's what formatQty() does.
      setScale(id, (wantYield(r) || baseYield(r) || 1) + Number(el.dataset.delta));
    });
    onAction("scale-mult", el => {
      const id = Number(el.dataset.id);
      const r = RECIPES.find(x => x.id === id);
      if (r) setScale(id, (baseYield(r) || 1) * Number(el.dataset.mult));
    });
    onAction("scale-reset", el => {
      const id = Number(el.dataset.id);
      delete SCALE[id];
      repaintScale(id);
    });
    onInputAction("scale-set", el => {
      // skipBar: rewriting the input being typed into would drop focus.
      setScale(Number(el.dataset.id), el.value, true);
    });
    onAction("edit-recipe", el => openEditor(Number(el.dataset.id)));

    function recipeCard(r) {
      const ings = INGREDIENTS.filter(i => i.recipe_id===r.id);
      let total=0, hasCost=false;
      ings.forEach(ing => { if (ing.est_cost!=null){ total+=Number(ing.est_cost); hasCost=true; } });

      const ingTable = ings.length
        ? `<div id="scalebar-${attr(r.id)}">${scaleBar(r)}</div>
           <div style="overflow-x:auto"><table class="rpt">
           <thead><tr><th>Ingredient</th><th class="num">Need</th><th class="num">Have</th>${SEE_MONEY?'<th class="num">Cost</th>':''}</tr></thead>
           <tbody id="ingrows-${attr(r.id)}">${ingredientRows(r, ings)}</tbody></table></div>`
        : '<div class="empty">No ingredients listed.</div>';

      return `<div class="wcard recipe-card" style="margin-bottom:12px">
        <details>
          <summary style="cursor:pointer;font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--espresso);display:flex;align-items:center;gap:8px">
            <span style="flex:1">${esc(r.name)} <span class="stat-label" style="font-weight:400">· ${esc(r.category||"Other")}</span>${SEE_MONEY && hasCost?` <span class="stat-label" style="font-weight:400">· est. $${total.toFixed(2)}</span>`:""}</span>
          </summary>
          <div style="margin-top:10px">
            ${(OPTS[r.id]&&OPTS[r.id].length)?`<div class="opt-chips">${OPTS[r.id].map(o=>{
              const pr=o.price!=null?"$"+Number(o.price).toFixed(2):"—";
              return `<span class="opt-chip">${o.option_name?esc(o.option_name)+" ":""}<b>${pr}</b></span>`;
            }).join("")}</div>`:""}
            ${ingTable}
            <div class="stat-label" style="margin-top:8px">dot shows live inventory: <span style="color:var(--sage)">●</span> in stock · <span style="color:var(--berry)">●</span> low</div>
            ${r.directions?`<div style="margin-top:12px"><div class="stat-label" style="font-weight:700;margin-bottom:4px">Directions</div>
              <div style="font-size:14px;line-height:1.5;white-space:pre-wrap">${esc(r.directions)}</div></div>`:""}
            ${CAN_EDIT?`<div style="margin-top:10px;display:flex;gap:8px">
              <button class="mini secondary" onclick="openEditor(${r.id})">Edit</button>
              <button class="mini" onclick="planRecipe(${r.id})">Add to plan</button>
              <button class="mini" style="background:var(--berry)" onclick="deleteRecipe(${r.id})">Delete</button>
            </div>`:""}
          </div>
        </details>
      </div>`;
    }

    // ---------- Admin editor (add / edit) ----------
    function openEditor(id){
      const editing = id ? RECIPES.find(r=>r.id===id) : null;
      const ings = id ? INGREDIENTS.filter(i=>i.recipe_id===id) : [];
      const cats = [...new Set([...categories(),"Bread","Bagels","Cakes","Pastries","Muffins & Loaves","Drinks","Other"])];
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:20px;overflow:auto";
      overlay.innerHTML=`<div class="card" style="max-width:520px;width:100%;margin:20px 0">
        <h2 class="section" style="margin-top:0">${editing?"Edit":"Add"} recipe</h2>
        <div class="field"><label>Name</label><input type="text" id="rName" value="${attr(editing?editing.name:"")}"></div>
        <div class="field"><label>Makes (yield)</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="number" min="0" step="any" id="rYieldQty" placeholder="24"
              value="${attr(editing&&editing.yield_qty!=null?editing.yield_qty:"")}" style="width:100px">
            <input type="text" id="rYieldUnit" placeholder="scones, loaves, dozen…"
              value="${attr(editing?editing.yield_unit:"")}" style="flex:1;min-width:140px">
          </div>
          <div class="stat-label" style="margin-top:4px">
            Needed to scale a batch, and to work out cost per item — without it the
            suggested prices on the Planner stay blank.
          </div>
        </div>
        <div class="field"><label>Category (pick one or type a new type)</label>
          <input type="text" id="rCat" list="catList" value="${attr(editing?editing.category:"")}"
            style="font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);width:100%" placeholder="e.g. Bread, Drinks, Seasonal…">
          <datalist id="catList">
            ${cats.map(c=>`<option value="${c}"></option>`).join("")}
          </datalist></div>
        <label class="stat-label">Ingredients</label>
        <div id="ingRows"></div>
        ${inventoryDatalist()}
        <button class="mini secondary" style="margin-top:8px" onclick="addIngRow()">+ Add ingredient</button>
        <div class="stat-label" style="margin-top:4px">
          Start typing to pick from inventory — <span style="color:var(--sage)">●</span> means it's tracked,
          so the recipe can show stock and warn when you're short.
        </div>
        <div class="field" style="margin-top:12px"><label>Directions</label>
          <textarea id="rDir" style="width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px" placeholder="Step-by-step directions…">${esc(editing?editing.directions:"")}</textarea></div>
        <div class="error" id="rErr" style="min-height:auto;margin-top:10px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="mini secondary" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
          <button class="mini" onclick="saveRecipe(${id||"null"})">Save recipe</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const wrap=overlay.querySelector("#ingRows");
      window.__ingWrap=wrap;
      if(ings.length) ings.forEach(i=>addIngRow(i)); else addIngRow();
    }
    // Ingredient names suggested from inventory, but NOT restricted to it —
    // recipes legitimately use things you don't stock (water, a garnish, an
    // item added to inventory later). A datalist suggests without trapping.
    //
    // Matching an inventory item matters for more than convenience: the
    // shortage check in ingredientRows() only compares when the units are the
    // same, so picking the item and inheriting its unit is what makes "Have"
    // and the low-stock warning work at all.
    function inventoryDatalist(){
      const items = Object.values(INV)
        .filter(i => i && i.name)
        .sort((a,b) => a.name.localeCompare(b.name));
      return `<datalist id="ingOptions">${items.map(i =>
        `<option value="${attr(i.name)}">${esc([roleLabel(i.owner), i.unit].filter(Boolean).join(" · "))}</option>`
      ).join("")}</datalist>`;
    }

    function addIngRow(data){
      const wrap=window.__ingWrap; if(!wrap) return;
      const row=document.createElement("div");
      row.style.cssText="display:flex;gap:6px;margin-bottom:6px;align-items:center";
      row.innerHTML=`
        <input type="text" placeholder="ingredient" class="ri-name" list="ingOptions"
          value="${attr(data?data.ingredient:"")}" style="flex:2" data-change="ing-pick">
        <input type="number" step="any" placeholder="amt" class="ri-amt" value="${data&&data.amount!=null?data.amount:""}" style="flex:1">
        <input type="text" placeholder="unit" class="ri-unit" value="${attr(data?data.unit:"")}" style="width:60px">
        <span class="ri-flag stat-label" style="width:18px;text-align:center" title=""></span>
        <button class="mini secondary" style="padding:4px 8px" onclick="this.parentElement.remove()">✕</button>`;
      wrap.appendChild(row);
      markIngRow(row);
    }

    // Show whether this ingredient is tracked in inventory. A recipe whose
    // ingredients aren't linked can't show Have, can't warn about shortages,
    // and won't contribute to the projection — worth saying so at entry time
    // rather than leaving someone to wonder why the dots are all grey.
    function markIngRow(row){
      const nameEl = row.querySelector(".ri-name");
      const flag = row.querySelector(".ri-flag");
      if (!nameEl || !flag) return;
      const key = (nameEl.value||"").toLowerCase().trim();
      const hit = key ? INV[key] : null;
      if (!key)      { flag.textContent = "";  flag.title = ""; }
      else if (hit)  { flag.textContent = "●"; flag.style.color = "var(--sage)";
                       flag.title = "Tracked in inventory — stock levels and shortages will show."; }
      else           { flag.textContent = "○"; flag.style.color = "#b0a48f";
                       flag.title = "Not in inventory. Fine, but this one won't show stock levels."; }
    }

    onChangeAction("ing-pick", el => {
      const row = el.closest("div");
      const hit = INV[(el.value||"").toLowerCase().trim()];
      // Only fill a unit that's empty — never overwrite what someone typed.
      if (hit && hit.unit) {
        const unitEl = row && row.querySelector(".ri-unit");
        if (unitEl && !unitEl.value.trim()) unitEl.value = hit.unit;
      }
      if (row) markIngRow(row);
    });
    async function saveRecipe(id){
      const name=document.getElementById("rName").value.trim();
      const category=document.getElementById("rCat").value;
      const directions=document.getElementById("rDir").value.trim()||null;
      const err=document.getElementById("rErr");
      if(!name){ err.textContent="Name is required."; return; }
      const yq=document.getElementById("rYieldQty").value;
      const yield_qty = yq==="" ? null : Number(yq);
      const yield_unit = document.getElementById("rYieldUnit").value.trim()||null;
      // recipes_yield_qty_positive would reject this anyway; catching it here
      // gives a sentence instead of a constraint name.
      if (yield_qty !== null && (!isFinite(yield_qty) || yield_qty <= 0)) {
        err.textContent="Yield must be a number greater than zero, or left blank."; return;
      }
      const rows=[...document.querySelectorAll("#ingRows > div")].map((row,idx)=>({
        ingredient:row.querySelector(".ri-name").value.trim(),
        amount:row.querySelector(".ri-amt").value===""?null:Number(row.querySelector(".ri-amt").value),
        unit:row.querySelector(".ri-unit").value.trim()||null,
        sort_order:idx
      })).filter(r=>r.ingredient);
      let recipeId=id;
      if(id){
        const {error:upErr}=await sb.from("recipes")
          .update({name,category,directions,yield_qty,yield_unit}).eq("id",id);
        if(upErr){ err.textContent=upErr.message; return; }
        await sb.from("recipe_ingredients").delete().eq("recipe_id",id);
      } else {
        const {data,error}=await sb.from("recipes")
          .insert({name,category,directions,yield_qty,yield_unit}).select().single();
        if(error){ err.textContent=error.message; return; }
        recipeId=data.id;
      }
      if(rows.length){
        await sb.from("recipe_ingredients").insert(rows.map(r=>({...r,recipe_id:recipeId})));
      }
      document.querySelector("div[style*=fixed]").remove();
      await load();
    }
    // Takes only the id; the name is resolved here rather than carried through an
    // onclick attribute. The previous .replace(/'/g,"") stripped single quotes but
    // not double quotes, so a recipe name containing a " broke out of the attribute.
    async function deleteRecipe(id){
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      const name = r.name || "this recipe";
      if(!confirm("Delete recipe: "+name+"?")) return;
      await sb.from("recipes").delete().eq("id",id);
      await load();
    }

    // Quick "add this recipe to a production day" from the recipe card
    function planRecipe(id){
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      const name = r.name || "this recipe";
      const today=new Date().toISOString().slice(0,10);
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px";
      overlay.innerHTML=`<div class="card" style="max-width:360px;width:100%;margin:0">
        <h2 class="section" style="margin-top:0">Add "${esc(name)}" to plan</h2>
        <div class="field"><label>Day</label><input type="date" id="planDate" value="${today}"></div>
        <div class="field"><label>Quantity</label><input type="number" id="planQty" value="1" min="1" step="1"></div>
        <div class="error" id="planErr" style="min-height:auto"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="mini secondary" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
          <button class="mini" id="planSave">Add to plan</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#planSave").onclick=async()=>{
        const date=overlay.querySelector("#planDate").value;
        const qty=Math.max(1,Number(overlay.querySelector("#planQty").value)||1);
        if(!date){ overlay.querySelector("#planErr").textContent="Pick a day."; return; }
        const { data:{user} } = await sb.auth.getUser();
        const {error}=await sb.from("plan_entries").insert({ plan_date:date, recipe_id:id, recipe_name:name, quantity:qty, created_by:user.id });
        if(error){ overlay.querySelector("#planErr").textContent=error.message; return; }
        overlay.remove();
      };
    }
  </script>
</body>
</html>
